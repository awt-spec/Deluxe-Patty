name: Búsqueda semanal de dueños

on:
  schedule:
    # Lunes 5:17 a. m. en Costa Rica (11:17 UTC).
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      prueba_zona:
        description: "Solo leer esta zona y mostrar lo que encuentra (sin base de datos ni WhatsApp). Vacío = búsqueda real."
        required: false
        default: ""
      prueba_paginas:
        description: "Páginas a leer en modo prueba"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: busqueda-duenos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prueba de lectura
        if: ${{ inputs.prueba_zona != '' }}
        # Los valores entran como variables, no pegados en el comando.
        env:
          ZONA: ${{ inputs.prueba_zona }}
          PAGINAS: ${{ inputs.prueba_paginas }}
        run: npx tsx worker/busqueda-duenos.ts --prueba "$ZONA" "$PAGINAS"

      - name: Búsqueda
        if: ${{ github.event_name == 'schedule' || inputs.prueba_zona == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PLANTILLA_AVISO: ${{ vars.WHATSAPP_PLANTILLA_AVISO }}
        run: npx tsx worker/busqueda-duenos.ts
